<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f37a8b"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Produksi">
  <link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <title>Daily Production</title><link rel="stylesheet" href="styles.css?v=4"><link rel="stylesheet" href="bold.css?v=4"><link rel="stylesheet" href="upgrade.css?v=4"><style>body,button,input,output{font-weight:700!important}</style>
</head>
<body><main>
  <header><span class="badge">REKOD HARIAN</span><h1>Daily Production</h1><p>Pilih flavour, masukkan pack dan loose.</p></header>
  <section class="card" aria-label="Borang rekod produksi">
    <label for="date">1. Tarikh</label><input id="date" type="date">
    <fieldset><legend>2. Flavour</legend><div class="flavours" id="flavours"></div><input id="otherFlavour" class="other-flavour" type="text" placeholder="Taip nama flavour" maxlength="40" hidden></fieldset>
    <section aria-labelledby="jumlahLabel"><label id="jumlahLabel">3. Jumlah</label><div class="quantity-grid"><button type="button" class="quantity-box active" id="packBox"><span>Pack</span><output id="packs">0</output><small>1 pack = 35 pcs</small></button><button type="button" class="quantity-box" id="looseBox"><span>Loose (pcs)</span><output id="loose">0</output><small>pcs</small></button></div><p class="keypad-hint" id="keypadHint">Masukkan Pack</p><div class="keypad" id="keypad" aria-label="Keypad jumlah"></div><div class="total-pcs">Jumlah keseluruhan <output id="totalPcs">0 pcs</output></div></section>
    <button class="save" id="save" type="button">Simpan Rekod</button><p class="message" id="message" role="status"></p>
  </section>
  <section class="records"><div class="records-title"><h2>Rekod Terkini</h2><button id="retry" class="link-button" type="button">Hantar semula</button></div><ul id="recordList"></ul></section>
</main><script src="app.js?v=4"></script></body>
</html>
